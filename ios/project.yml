name: Memorium
options:
  bundleIdPrefix: com.memorium
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # The team that signs App Store builds. It lives here rather than only in
    # Xcode's signing tab because the project is generated: `xcodegen generate`
    # rewrites project.pbxproj, and anything set through the UI alone is lost
    # on the next run.
    DEVELOPMENT_TEAM: C5S4NV2VC6
    # Ad-hoc signing for local builds -- but signed, because an unsigned app
    # has no entitlements at all and the Keychain then refuses every write
    # with errSecMissingEntitlement (-34018). That failure is silent, and the
    # symptom is the API token never surviving a relaunch.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Memorium:
    type: application
    platform: iOS
    sources:
      - path: Memorium
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      # The SwiftUI sign-in button, so the branding is Google's own rather
      # than something approximated with a Label.
      - package: GoogleSignIn
        product: GoogleSignInSwift
    # A real Info.plist rather than GENERATE_INFOPLIST_FILE: Google's callback
    # needs a CFBundleURLTypes entry, which the INFOPLIST_KEY_* settings cannot
    # express.
    info:
      path: Memorium/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Memorium
        # The upload build number. Here rather than edited in the plist alone,
        # which `xcodegen generate` resets to 1 on its next run.
        CFBundleVersion: "2"
        # Portrait-only on iPhone, where the study screens are designed to sit.
        # iPad is a different story: App Store validation rejects any iPad
        # build (error 90474) that does not offer all four orientations, since
        # a multitasking app can be resized into any of them.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Speaking mode records audio and transcribes it. Without these two
        # keys the app crashes the first time the microphone is touched.
        NSMicrophoneUsageDescription: "Memorium listens while you practise saying words aloud, so it can tell you how close you got."
        NSSpeechRecognitionUsageDescription: "Memorium transcribes what you say to score your pronunciation. Recognition runs on your device."
        # Both come from your own Google OAuth iOS client -- see GOOGLE_CLIENT_ID
        # below. Sign-in stays disabled, with an explanation on screen, until
        # they are filled in.
        GIDClientID: $(GOOGLE_CLIENT_ID)
        # The one server this build talks to; see MEMORIUM_API_URL below.
        MemoriumAPIURL: $(MEMORIUM_API_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memorium.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # Compiling the icon set is what writes CFBundleIconName into the
        # Info.plist; without it the App Store rejects the upload (90713).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # --- Server --------------------------------------------------------
        # Where the app sends every request. A build constant rather than a
        # setting typed into each install: there is one server, and an address
        # nobody has to type is an address nobody gets wrong. Point a debug
        # build somewhere else with MEMORIUM_DEV_URL in the environment instead
        # of editing this. Re-run `xcodegen generate` after changing it.
        MEMORIUM_API_URL: "https://raspberrypi.tail0bfe57.ts.net/memorium/api"
        # --- Google Sign-In ------------------------------------------------
        # From the Google Cloud console: APIs & Services -> Credentials ->
        # Create credentials -> OAuth client ID -> iOS, with the bundle ID
        # above. There is no client secret for iOS clients.
        #
        #   GOOGLE_CLIENT_ID           123-abc.apps.googleusercontent.com
        #   GOOGLE_REVERSED_CLIENT_ID  com.googleusercontent.apps.123-abc
        #
        # The same client ID goes in the server's MEMORIUM_GOOGLE_CLIENT_ID,
        # which is what makes the server accept tokens minted for this app and
        # nothing else. Re-run `xcodegen generate` after editing.
        GOOGLE_CLIENT_ID: "520263492590-eh7qsu4h3it28ife7opbmps5hmhfo4vi.apps.googleusercontent.com"
        GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.520263492590-eh7qsu4h3it28ife7opbmps5hmhfo4vi"

  MemoriumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MemoriumTests
    dependencies:
      - target: Memorium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memorium.app.tests
        GENERATE_INFOPLIST_FILE: YES
